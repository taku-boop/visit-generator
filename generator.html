<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 訪問資料ジェネレーター (Gamma Style)</title>
<!-- PptxGenJS CDN -->
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root {
    --bg-dark: #0b0f17;
    --panel-dark: #151c28;
    --card-dark: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-purple: #818cf8;
    --accent-pink: #c084fc;
    --accent-blue: #38bdf8;
    --border-color: #334155;
  }

  body.light-mode {
    --bg-dark: #f8fafc;
    --panel-dark: #ffffff;
    --card-dark: #f1f5f9;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    transition: background 0.3s, color 0.3s;
    padding-bottom: 80px;
  }

  header {
    background: var(--panel-dark);
    border-bottom: 1px solid var(--border-color);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 18px; margin: 0; font-weight: 800;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  
  main { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

  .panel {
    background: var(--panel-dark);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  textarea {
    width: 100%;
    height: 160px;
    background: var(--bg-dark);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    color: var(--text-main);
    font-size: 14px;
    line-height: 1.6;
    outline: none;
    transition: border 0.2s;
  }
  textarea:focus { border-color: var(--accent-purple); }

  .controls { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .btn-group { display: flex; gap: 10px; }

  .btn {
    background: linear-gradient(135deg, var(--accent-purple), #6366f1);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

  .theme-toggle { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-muted); }
  .theme-btn { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .theme-btn.active { border-color: var(--accent-purple); }

  /* Canvas (Gamma Deck View) */
  #presentationCanvas { margin-top: 40px; display: flex; flex-direction: column; gap: 32px; }

  .gamma-card {
    background: var(--panel-dark);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 36px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  .gamma-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink), var(--accent-blue));
  }

  .card-badge { font-size: 11px; font-weight: 800; color: var(--accent-purple); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; display: block; }
  
  .card-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 20px 0;
    color: var(--text-main);
    outline: none;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }

  .grid-box {
    background: var(--card-dark);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    transition: border-color 0.2s;
  }
  .grid-box:hover { border-color: var(--accent-purple); }

  .grid-box h4 { margin: 0 0 10px 0; font-size: 15px; color: var(--accent-purple); outline: none; }
  .grid-box ul { margin: 0; padding-left: 18px; color: var(--text-muted); font-size: 13px; line-height: 1.7; }
  .grid-box li { outline: none; margin-bottom: 4px; }

</style>
</head>
<body>

<header>
  <h1>✨ Gamma AI Presentation Generator</h1>
  <div class="theme-toggle">
    <span>テーマ:</span>
    <div class="theme-btn active" style="background:#0b0f17;" onclick="toggleTheme('dark', this)"></div>
    <div class="theme-btn" style="background:#f8fafc;" onclick="toggleTheme('light', this)"></div>
  </div>
</header>

<main>
  <div class="panel">
    <h2 style="margin-top:0; font-size:16px;">AI プレゼンスライド自動生成プロンプト</h2>
    <textarea id="promptInput" placeholder="訪問メモや提案内容をそのまま貼り付けてください。AIが自動解析してスライド構造化します。

例）8/8 A社訪問。担当：田中様。
課題：既存の粉体成型機の外装が古く、展示会での見栄えが悪いと相談。
提案：デザインだけでなく筐体設計・量産まで一貫対応できる点に興味あり。
条件：予算感は300〜500万円、納期は年内希望。
次アクション：見積提出、9月頭に再訪問。"></textarea>

    <div class="controls">
      <div class="btn-group">
        <button class="btn" onclick="generateDeck()">✨ AIスライドを生成する</button>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="exportBtn" style="display:none;" onclick="exportPPTX()">📥 PowerPoint (.pptx) を出力</button>
      </div>
    </div>
  </div>

  <div id="presentationCanvas"></div>
</main>

<script>
let deckData = [];

function toggleTheme(mode, btn) {
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'light') {
    document.body.classList.add('light-mode');
  } else {
    document.body.classList.remove('light-mode');
  }
}

/* ========================================================
   クライアントサイド テキスト解析エンジン (要約・構造化)
======================================================== */
function parseTextToDeck(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  
  // キーワード抽出・分類ロジック
  let companyOrClient = "訪問先企業";
  let person = "";
  let issues = [];
  let proposals = [];
  let conditions = [];
  let nextActions = [];
  let generalNotes = [];

  lines.forEach(line => {
    // 会社名・担当者
    if (line.includes("訪問") || line.includes("社") || line.includes("担当")) {
      const mPerson = line.match(/担当[:：]?\s*([^\s,、。]+)/);
      if (mPerson) person = mPerson[1];
      const mComp = line.match(/([A-Za-z0-9一-龠ぁ-ゔァ-ヴー]+(?:社|様|御中))/);
      if (mComp) companyOrClient = mComp[1];
    }

    // 課題・悩み
    if (line.includes("課題") || line.includes("悩み") || line.includes("古い") || line.includes("困") || line.includes("相談") || line.includes("見栄え")) {
      issues.push(line.replace(/^(課題|悩み)[:：]?\s*/, ''));
    }
    // 提案・強み・関心
    else if (line.includes("提案") || line.includes("興味") || line.includes("対応") || line.includes("一貫") || line.includes("強み") || line.includes("デザイン")) {
      proposals.push(line.replace(/^(提案|関心|強み)[:：]?\s*/, ''));
    }
    // 条件（予算・納期）
    else if (line.includes("予算") || line.includes("納期") || line.includes("条件") || line.includes("万") || line.includes("月")) {
      conditions.push(line.replace(/^(条件|予算|納期)[:：]?\s*/, ''));
    }
    // ネクストアクション
    else if (line.includes("次") || line.includes("アクション") || line.includes("見積") || line.includes("再訪") || line.includes("提出") || line.includes("予定")) {
      nextActions.push(line.replace(/^(次|ネクストアクション|次アクション)[:：]?\s*/, ''));
    }
    else {
      generalNotes.push(line);
    }
  });

  // デフォルト埋め合わせ処理（入力が少ない場合も崩さない）
  if (issues.length === 0) issues = [lines[0] || "現状の課題抽出および要件ヒアリング"];
  if (proposals.length === 0) proposals = ["構想・デザインから設計・試作まで一貫サポート", "アジャイル開発による納期圧縮提案"];
  if (conditions.length === 0) conditions = ["予算・納期の最適化プラン検討"];
  if (nextActions.length === 0) nextActions = ["お見積り・ご提案書の作成", "次回お打ち合わせ設定"];

  return [
    {
      badge: "EXECUTIVE SUMMARY",
      title: `${companyOrClient} 様 訪問対話・プロジェクト要約`,
      grid: [
        { title: "訪問概要", items: [`ターゲット: ${companyOrClient}`, person ? `ご担当者: ${person}` : "担当者ヒアリング完了", `対話日時: ${new Date().toLocaleDateString('ja-JP')}`] },
        { title: "主要テーマ", items: generalNotes.length > 0 ? generalNotes.slice(0, 3) : ["新意匠・筐体開発の検討", "仕様および製造プロセスの見直し"] }
      ]
    },
    {
      badge: "ISSUES & REQUIREMENTS",
      title: "現状の課題およびご要望",
      grid: [
        { title: "直面している課題", items: issues },
        { title: "前提条件・制約", items: conditions }
      ]
    },
    {
      badge: "PROPOSED SOLUTION",
      title: "弊社からのソリューション提案",
      grid: [
        { title: "提案価値・アプローチ", items: proposals },
        { title: "提供可能な強み", items: ["デザイン×筐体設計×試作の一貫体制", "開発スピードの最大化とリスク低減"] }
      ]
    },
    {
      badge: "NEXT STEPS",
      title: "今後の進め方（ネクストアクション）",
      grid: [
        { title: "次回家アクション項目", items: nextActions },
        { title: "スケジュール目安", items: ["提案書・見積書のご提出", "技術仕様および試作プロセスの最終確定"] }
      ]
    }
  ];
}

function generateDeck() {
  const input = document.getElementById('promptInput').value.trim();
  if (!input) {
    alert("プロンプト（訪問メモ）を入力してください。");
    return;
  }

  deckData = parseTextToDeck(input);
  renderCanvas();
  document.getElementById('exportBtn').style.display = 'inline-block';
}

function renderCanvas() {
  const canvas = document.getElementById('presentationCanvas');
  canvas.innerHTML = '';

  deckData.forEach((card, cIdx) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'gamma-card';
    
    let gridHtml = card.grid.map((g, gIdx) => `
      <div class="grid-box">
        <h4 contenteditable="true" onblur="deckData[${cIdx}].grid[${gIdx}].title = this.innerText">${g.title}</h4>
        <ul>
          ${g.items.map((item, iIdx) => `
            <li contenteditable="true" onblur="deckData[${cIdx}].grid[${gIdx}].items[${iIdx}] = this.innerText">${item}</li>
          `).join('')}
        </ul>
      </div>
    `).join('');

    cardEl.innerHTML = `
      <span class="card-badge">${card.badge}</span>
      <h3 class="card-title" contenteditable="true" onblur="deckData[${cIdx}].title = this.innerText">${card.title}</h3>
      <div class="card-grid">${gridHtml}</div>
    `;

    canvas.appendChild(cardEl);
  });
}

// PowerPoint (.pptx) 高精度出力
function exportPPTX() {
  if (typeof PptxGenJS === 'undefined') {
    alert('ライブラリ読み込み中... 数秒待ってから再試行してください。');
    return;
  }

  const pptx = new PptxGenJS();
  pptx.layout = 'WIDE';

  deckData.forEach(card => {
    const slide = pptx.addSlide();
    slide.background = { color: '0B0F17' };

    // Badge & Header
    slide.addText(card.badge, { x: 0.8, y: 0.5, fontSize: 11, bold: true, color: '818CF8' });
    slide.addText(card.title, { x: 0.8, y: 0.9, w: 11, fontSize: 22, bold: true, color: 'FFFFFF' });

    // Grid Layout
    const boxWidth = 5.5;
    card.grid.forEach((g, idx) => {
      const col = idx % 2;
      const row = Math.floor(idx / 2);
      const xPos = 0.8 + (col * 5.9);
      const yPos = 1.8 + (row * 2.6);

      // Card Box Background
      slide.addShape(pptx.shapes.ROUNDED_RECTANGLE, {
        x: xPos, y: yPos, w: boxWidth, h: 2.3,
        fill: { color: '151C28' },
        line: { color: '334155', width: 1 },
        rectRadius: 0.1
      });

      slide.addText(g.title, { x: xPos + 0.3, y: yPos + 0.2, w: boxWidth - 0.6, fontSize: 15, bold: true, color: '818CF8' });
      
      const bulletItems = g.items.map(it => ({ text: it, options: { breakLine: true, fontSize: 12, color: '94A3B8' } }));
      slide.addText(bulletItems, { x: xPos + 0.3, y: yPos + 0.7, w: boxWidth - 0.6, h: 1.4, bullet: true, valign: 'top' });
    });
  });

  pptx.writeFile({ fileName: 'AI_Generated_Report.pptx' });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 訪問資料ジェネレーター (Gamma Style)</title>
<!-- PPTX Generator Library -->
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #f8fafc;
    --sub-text: #94a3b8;
    --accent-red: #f43f5e;
    --accent-navy: #1e3a8a;
    --accent-mono: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; color: #fff; }
  header span { font-size: 12px; color: #818cf8; background: rgba(99,102,241,0.1); padding: 4px 8px; border-radius: 4px; }
  
  main { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

  /* Prompt Box Area */
  .prompt-panel {
    background: var(--card-bg);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  }
  .prompt-panel h2 { margin-top: 0; font-size: 16px; color: #f8fafc; }
  textarea {
    width: 100%;
    height: 140px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px;
    color: #fff;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  
  .controls { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn-export { background: #10b981; }
  .btn-export:hover { background: #059669; }

  /* Company & Theme Selector */
  .selector-group { display: flex; gap: 10px; margin-top: 12px; }
  .chip {
    background: #0f172a;
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    color: var(--sub-text);
  }
  .chip.active { border-color: var(--primary); color: #fff; background: rgba(99,102,241,0.2); }

  /* Slide Canvas (Gamma Style) */
  #slideCanvas { margin-top: 40px; display: flex; flex-direction: column; gap: 24px; }
  .slide-card {
    background: #ffffff;
    color: #0f172a;
    border-radius: 12px;
    aspect-ratio: 16 / 9;
    padding: 40px;
    position: relative;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .slide-card.tpl-red { border-top: 8px solid var(--accent-red); }
  .slide-card.tpl-navy { border-top: 8px solid var(--accent-navy); }
  .slide-card.tpl-mono { border-top: 8px solid var(--accent-mono); }

  .slide-tag { font-size: 12px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
  .slide-title { font-size: 28px; font-weight: 800; margin: 10px 0; outline: none; }
  .slide-bullets { font-size: 16px; line-height: 1.8; color: #334155; }
  .slide-bullets li { margin-bottom: 8px; outline: none; }
  .slide-footer { font-size: 10px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 10px; margin-top: auto; }
</style>
</head>
<body>

<header>
  <h1>✨ AI 訪問資料ジェネレーター</h1>
  <span>Gamma Engine Powered</span>
</header>

<main>
  <!-- Prompt Input Panel -->
  <div class="prompt-panel">
    <h2>🎯 どんな資料を作りますか？（訪問メモ・メモ書きを貼り付け）</h2>
    <textarea id="promptInput" placeholder="例：8/8 A社訪問。担当：田中様。課題：既存機の外装を新しくしたい。予算300〜500万。デザインから量産まで一貫対応できる点に好感。次回見逃せない見積提出。"></textarea>

    <div class="selector-group">
      <span class="chip active" onclick="setCompany('クロスエフェクト', this)">クロスエフェクト</span>
      <span class="chip" onclick="setCompany('クロスデザイン', this)">クロスデザイン</span>
      <span class="chip" onclick="setCompany('クロスメディカル', this)">クロスメディカル</span>
    </div>

    <div class="controls">
      <button class="btn" onclick="generateSlides()">✨ AIスライドを生成する</button>
      <button class="btn btn-export" id="exportBtn" style="display:none;" onclick="exportPPTX()">📥 PowerPoint (.pptx) をダウンロード</button>
    </div>
  </div>

  <!-- Generated Slides Viewport -->
  <div id="slideCanvas"></div>
</main>

<script>
let currentCompany = "クロスエフェクト";
let generatedSlideData = [];

function setCompany(name, el) {
  currentCompany = name;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

// Simple AI Structuring Engine (Gamma-like text parser)
function generateSlides() {
  const text = document.getElementById('promptInput').value.trim();
  if(!text) {
    alert("プロンプト（訪問メモ）を入力してください。");
    return;
  }

  const lines = text.split('\n').filter(l => l.trim() !== '');
  
  // AI-like Slide Construction Logic
  generatedSlideData = [
    {
      type: 'title',
      tag: 'VISIT REPORT',
      title: lines[0] ? lines[0].substring(0, 30) : '訪問対話報告書',
      bullets: ['提案会社：' + currentCompany, '作成日：' + new Date().toLocaleDateString('ja-JP')]
    },
    {
      type: 'content',
      tag: 'ISSUES & NEEDS',
      title: '現状の課題とニーズ',
      bullets: lines.length > 1 ? lines.slice(1, 4) : [text, 'デザイン・仕様の見直し', '納期・コストの最適化提案']
    },
    {
      type: 'content',
      tag: 'PROPOSAL',
      title: currentCompany + ' からのご提案',
      bullets: [
        '構想設計から試作・量産まで一貫したワンストップサポート',
        'アジャイル開発による圧倒的なスピード対応',
        '貴社仕様に合わせたカスタマイズソリューション'
      ]
    },
    {
      type: 'content',
      tag: 'NEXT ACTION',
      title: '今後の進め方・ネクストアクション',
      bullets: ['お見積り・仕様提案書の作成', '次回打ち合わせ日程の調整', '試作サンプルの確認']
    }
  ];

  renderSlides();
  document.getElementById('exportBtn').style.display = 'inline-block';
}

function renderSlides() {
  const canvas = document.getElementById('slideCanvas');
  canvas.innerHTML = '';

  generatedSlideData.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'slide-card tpl-red';
    card.innerHTML = `
      <div>
        <div class="slide-tag">${s.tag}</div>
        <div class="slide-title" contenteditable="true" onblur="updateTitle(${idx}, this.innerText)">${s.title}</div>
        <ul class="slide-bullets">
          ${s.bullets.map((b, bIdx) => `<li contenteditable="true" onblur="updateBullet(${idx}, ${bIdx}, this.innerText)">${b}</li>`).join('')}
        </ul>
      </div>
      <div class="slide-footer">${currentCompany} | Slide ${idx + 1}</div>
    `;
    canvas.appendChild(card);
  });
}

function updateTitle(slideIdx, val) {
  generatedSlideData[slideIdx].title = val;
}

function updateBullet(slideIdx, bulletIdx, val) {
  generatedSlideData[slideIdx].bullets[bulletIdx] = val;
}

// PPTX Export Logic
function exportPPTX() {
  if (typeof PptxGenJS === 'undefined') {
    alert('ライブラリ読込中... 数秒待ってから再試行してください。');
    return;
  }

  const pptx = new PptxGenJS();
  pptx.layout = 'WIDE';

  generatedSlideData.forEach(s => {
    const slide = pptx.addSlide();
    
    // Slide Header / Tag
    slide.addText(s.tag, { x: 0.8, y: 0.6, fontSize: 12, bold: true, color: '6366F1' });
    
    // Slide Title
    slide.addText(s.title, { x: 0.8, y: 1.0, w: 11, fontSize: 26, bold: true, color: '0F172A' });
    
    // Bullet Points
    const bulletItems = s.bullets.map(b => ({ text: b, options: { breakLine: true, fontSize: 16, color: '334155' } }));
    slide.addText(bulletItems, { x: 0.8, y: 2.2, w: 11, h: 4, bullet: true });

    // Footer
    slide.addText(currentCompany, { x: 0.8, y: 7.0, fontSize: 10, color: '94A3B8' });
  });

  pptx.writeFile({ fileName: 'AI_Generated_Presentation.pptx' });
}
</script>

</body>
</html>
